# การทดลอง masked — เทียบกับ effb0_multiclass_bbox ที่มีผลแล้ว
# ต่างกันแค่ variant (xray_masked แทน xray_bbox) ที่เหลือเหมือนกันทุกบรรทัด
# เพื่อให้ผลต่างที่เห็น มาจาก "แบบ crop" อย่างเดียว ไม่ปนกับตัวแปรอื่น

experiment:
  name: effb0_multiclass_masked
  seed: 42

data:
  split_dir: data/processed/splits
  variant: xray_masked         # <-- เปลี่ยนจาก xray_bbox
  task: multiclass
  img_size: null

model:
  backbone: efficientnet_b0
  pretrained: true
  level_embed_dim: 32
  head_dropout: 0.2
  freeze_backbone: false

loss:
  gamma: 2.0
  use_class_weights: true

train:
  epochs: 15
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  patience: 3
  num_workers: 4

output:
  dir: outputs/runs/effb0_multiclass_masked    # <-- เปลี่ยนชื่อ output ด้วย