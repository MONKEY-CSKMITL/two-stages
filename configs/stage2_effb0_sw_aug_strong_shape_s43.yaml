experiment:
  name: effb0_sw_aug_strong_shape_s43
  seed: 43
data:
  split_dir: data/processed/splits
  variant: xray_masked
  task: multiclass
  img_size: null
  resize_mode: pad
  preprocess: destripe
  augment: strong_shape
model:
  backbone: efficientnet_b0
  pretrained: true
  level_embed_dim: 32
  head_dropout: 0.2
  freeze_backbone: false
loss:
  gamma: 2.0
  use_class_weights: true
train:
  epochs: 50
  batch_size: 64
  lr: 0.0001
  weight_decay: 0.0001
  patience: 15
  num_workers: 4
output:
  dir: outputs/runs/effb0_sw_aug_strong_shape_s43
