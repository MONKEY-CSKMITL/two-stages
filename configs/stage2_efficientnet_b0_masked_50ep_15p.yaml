experiment:
  name: effb0_multiclass_bbox_50ep_15p
  seed: 42

data:
  split_dir: data/processed/splits
  variant: xray_masked
  task: multiclass
  img_size: null

model:
  backbone: efficientnet_b0
  pretrained: true
  level_embed_dim: 32
  head_dropout: 0.2
  freeze_backbone: false

loss:
  gamma: 2.0
  use_class_weights: true

train:
  epochs: 50      
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  patience: 15 
  num_workers: 4

output:
  dir: outputs/runs/effb0_multiclass_bbox_50ep_15p