experiment:
  name: effb0_otf_standard_shape_15ep
  seed: 42
data:
  split_dir: data/processed/splits
  variant: xray_masked
  task: multiclass
  img_size: null
  resize_mode: pad
  preprocess: destripe
  augment: standard_shape
  geometry_manifest: data/interim/crops/manifest.csv
model:
  backbone: efficientnet_b0
  pretrained: true
  level_embed_dim: 32
  head_dropout: 0.2
  freeze_backbone: false
  use_geometry: false
  use_metadata: false
loss:
  gamma: 2.0
  use_class_weights: true
train:
  epochs: 15
  batch_size: 64
  lr: 0.0001
  weight_decay: 0.0001
  patience: 3
  num_workers: 4
output:
  dir: outputs/runs/effb0_otf_standard_shape_15ep
