# ทดสอบ stretch resize บน bbox (ไม่ masked) — คู่กับ stage2_effb0_masked_stretch.yaml
# เทียบกับ effb0_multiclass_bbox ที่มีผลแล้ว (macro_f1 0.428, auc 0.797)
# ต่างกันแค่ resize_mode ตัวเดียว ที่เหลือเหมือนกันหมด

experiment:
  name: effb0_multiclass_bbox_stretch
  seed: 42

data:
  split_dir: data/processed/splits
  variant: xray_bbox            # <-- ไม่ masked (ต่างจากตัวที่มีอยู่แล้ว)
  task: multiclass
  img_size: null
  resize_mode: stretch          # <-- เปลี่ยนจาก pad (ค่าเริ่มต้น)

model:
  backbone: efficientnet_b0
  pretrained: true
  level_embed_dim: 32
  head_dropout: 0.2
  freeze_backbone: false

loss:
  gamma: 2.0
  use_class_weights: true

train:
  epochs: 15
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  patience: 3
  num_workers: 4

output:
  dir: outputs/runs/effb0_multiclass_bbox_stretch