# วินิจฉัยสั้น 15 epoch: augmentation หยุด overfit ได้ไหม
# ตัวเทียบคือ baseline (ไม่มี augment) ที่ epoch 15 มี train_loss = 0.0037
# ถ้า train_loss ของชุดนี้สูงกว่านั้นชัดเจน แปลว่า augmentation ทำงาน

experiment:
  name: diag_aug_standard
  seed: 42

data:
  split_dir: data/processed/splits
  variant: xray_masked
  task: multiclass
  img_size: null
  resize_mode: pad
  preprocess: none
  augment: standard

model:
  backbone: efficientnet_b0
  pretrained: true
  level_embed_dim: 32
  head_dropout: 0.2
  freeze_backbone: false

loss:
  gamma: 2.0
  use_class_weights: true

train:
  epochs: 15
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  patience: 15
  num_workers: 4

output:
  dir: outputs/runs/diag_aug_standard
